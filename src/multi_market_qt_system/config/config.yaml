mode: backtest            # backtest 或 live

market_data: # 数据源配置
  source: openbb          # openbb 或 vnpy

brokers:
  futu:
    enable: false
    host: 127.0.0.1
    port: 11111
  binance:
    enable: false
    api_key: YOUR_API_KEY
    secret_key: YOUR_SECRET_KEY

strategy:
  name: dual_ma
  params:
    short_window: 20
    long_window: 50
    # trade_size: 20 # 由 PositionSizer 决定，故注释掉 trade_size, 新增 trade_pct
    trade_pct: 0.05     # 每次最多用 5% 资金下单

risk_control:
  max_position_pct: 0.1     # 单标的最大持仓比例
  max_drawdown: 0.2       # 20% 回撤
  max_daily_loss_pct: 0.02   # 单日最大亏损比例
  max_daily_trades: 20       # 单日最多交易次数

# 新增全局交易成本参数
initial_cash: 200000
commission: 0.0005    # 每笔成交的手续费率
slippage: 0.0002      # 滑点率

logging:
  log_dir:         # 日志文件夹
  log_file:      # 日志文件名
  console: false            # 是否输出到控制台
  level: "DEBUG"             # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
